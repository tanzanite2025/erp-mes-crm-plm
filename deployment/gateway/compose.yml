name: tanzanite-edge

services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ERP_SITE: ${ERP_SITE:-http://erp.tanzanite.site}
      CADDYFILE: |
        {
          admin off
          servers {
            protocols h1 h2
            trusted_proxies static 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
            trusted_proxies_strict
          }
        }

        {$$ERP_SITE} {
          encode zstd gzip
          header {
            Strict-Transport-Security "max-age=31536000; includeSubDomains"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
            -Server
          }
          reverse_proxy erp-web:8080
          log {
            output stdout
            format json
          }
        }

        :80 {
          @health path /__edge/health
          respond @health "ok" 200
          respond 404
        }
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        printf '%s\n' "$$CADDYFILE" > /tmp/Caddyfile
        caddy fmt --overwrite /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/__edge/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    name: tanzanite-edge

volumes:
  caddy_data:
    name: tanzanite-edge-caddy-data
  caddy_config:
    name: tanzanite-edge-caddy-config
