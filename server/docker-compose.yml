services:
  db:
    image: postgres:15-alpine
    container_name: xdfc-postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xdfc-redis
    ports:
      - "127.0.0.1:16379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-xdfc_default_redis_password}
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: xdfc-loki
    user: root
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deployment/loki/loki-config.yaml:/etc/loki/local-config.yaml
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: xdfc-promtail
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deployment/loki/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: xdfc-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./deployment/loki/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
    restart: always

  search-engine:
    build:
      context: ./search-engine
      dockerfile: Dockerfile
    expose:
      - "8081"
    restart: always

  app:
    build: .
    expose:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - GIN_MODE=${GIN_MODE}
      - ALERT_WEBHOOK_TOKEN=${ALERT_WEBHOOK_TOKEN}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - EXCHANGERATE_API_KEY=${EXCHANGERATE_API_KEY}
      - SEARCH_ENGINE_URL=${SEARCH_ENGINE_URL:-http://search-engine:8081}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-xdfc_default_redis_password}
      - AI_PROXY_STREAM_TIMEOUT_MS=${AI_PROXY_STREAM_TIMEOUT_MS:-120000}
      - AI_PROXY_ALLOW_PRIVATE_IP=${AI_PROXY_ALLOW_PRIVATE_IP:-false}
      - AI_PROXY_ALLOWED_HOSTS=${AI_PROXY_ALLOWED_HOSTS:-api.openai.com,generativelanguage.googleapis.com,api.minimax.io,api.minimaxi.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      search-engine:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  nginx_lb:
    image: nginx:alpine
    container_name: xdfc-nginx-lb
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deployment/nginx/internal_lb.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - app
    restart: always

  watchdog:
    build:
      context: ./watchdog
      dockerfile: Dockerfile
    container_name: xdfc-watchdog
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
