<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Print Preview</title>
    <style>
      body {
        margin: 0;
        background: #d7dbe0;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;

      #root {
        padding: 24px 0 48px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { LanguageProvider } from '/src/context/language-provider.tsx'
      import { PurchaseOrderEvidencePrint } from '/src/features/trading/components/purchase/purchase-order-evidence-print.tsx'
      import { PurchaseReturnPrint } from '/src/features/trading/components/purchase/purchase-return-print.tsx'

      const sharedEvidences = Array.from({ length: 4 }, (_, index) => ({

      const order = {
        id: 'po-preview',
        orderNo: 'PO-20260411-001',

            materialId: 'mat-1',

            expectedDate: '2026-04-12',
            receivedQty: 300,

            status: 'Awaiting',
          },
        ],
        note: '供应商要求随附现场照片用于对账与异常回传',
        isDeleted: false,
        version: 1,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      }

      const returnRecord = {
        id: 'ret-preview',
        returnNo: 'PR-20260411-001',
        purchaseOrderId: 'po-preview',
        purchaseOrderNo: order.orderNo,
        supplierName: order.supplierName,
        returnDate: new Date().toISOString(),
        issueCategory: '外观异常',

            issueCategory: '包装破损',

            lineNo: 2,
            materialCode: 'SS-02',
            materialName: '铝片',
            specification: '1.0mm',
            quantity: 40,

            amount: 168,
            issueCategory: '标签异常',
            reason: '标签模糊，批次无法识别',
            evidences: sharedEvidences.slice(2, 4),
          },
        ],
      }

      function PreviewPage() {
        return React.createElement(
          LanguageProvider,
          null,
          React.createElement(
            'div',
            { style: { display: 'grid', gap: '24px', justifyItems: 'center' } },
            React.createElement(PurchaseOrderEvidencePrint, { order }),
            React.createElement(PurchaseReturnPrint, { record: returnRecord }),
          ),
        )
      }

      createRoot(document.getElementById('root')).render(React.createElement(PreviewPage))
    </script>
  </body>
  </html>
