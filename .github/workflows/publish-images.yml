name: Publish Production Images

on:
  push:
    branches:
      - master
    paths:
      - ".dockerignore"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "server/**"
      - "cutting-engine/**"
      - "deployment/docker/**"
      - "deployment/nginx/erp-web.conf"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: erp-web
            context: .
            dockerfile: deployment/docker/web.Dockerfile
          - image: erp-api
            context: ./server
            dockerfile: ./server/Dockerfile
          - image: erp-search
            context: ./server/search-engine
            dockerfile: ./server/search-engine/Dockerfile
          - image: erp-watchdog
            context: ./server/watchdog
            dockerfile: ./server/watchdog/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=master
            type=sha,prefix=sha-
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
